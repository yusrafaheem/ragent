apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragent-agent
  namespace: ragent
  labels:
    app: ragent-agent
spec:
  # Stateless: holds no index, no per-request server-side session state, and
  # calls the retrieval service over HTTP for every tool invocation, so it
  # can be scaled horizontally behind the Service below with no coordination
  # needed between replicas.
  replicas: 2
  selector:
    matchLabels:
      app: ragent-agent
  template:
    metadata:
      labels:
        app: ragent-agent
    spec:
      containers:
        - name: agent
          image: ragent-agent:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ragent-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ragent-secrets
                  key: OPENAI_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ragent-agent
  namespace: ragent
spec:
  selector:
    app: ragent-agent
  ports:
    - port: 8000
      targetPort: 8000
  # LoadBalancer since this is the externally-facing entrypoint; the
  # retrieval Service stays ClusterIP-only since nothing outside the
  # cluster should call it directly.
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ragent-agent
  namespace: ragent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ragent-agent
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
