apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragent-retrieval
  namespace: ragent
  labels:
    app: ragent-retrieval
spec:
  # Single replica by default: this service holds the vector index
  # in-process (see apps/retrieval_service.py), so naively scaling replicas
  # would give each pod its own independent, incomplete index rather than a
  # shared one. Scaling this service for real requires moving the index to
  # a shared backing store (e.g. a managed vector DB, or FAISS index files
  # on a shared volume) -- noted here rather than silently shipping a
  # config that looks horizontally scalable but isn't.
  replicas: 1
  selector:
    matchLabels:
      app: ragent-retrieval
  template:
    metadata:
      labels:
        app: ragent-retrieval
    spec:
      containers:
        - name: retrieval
          image: ragent-retrieval:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: ragent-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ragent-retrieval
  namespace: ragent
spec:
  selector:
    app: ragent-retrieval
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
