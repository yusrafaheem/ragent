name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev tools
        run: pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check src tests apps scripts
      - name: Check formatting with black
        run: black --check src tests apps scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  test-real-backends:
    # Installs the optional ML extras (faiss-cpu, sentence-transformers) and
    # runs tests/test_real_backends.py against the real implementations,
    # not the NumPy/hashing fallback path. This job needs real network
    # access to PyPI and to download a small sentence-transformers model,
    # which is exactly what a fully offline dev sandbox doesn't have --
    # see README.md's "what's actually verified where" section.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with vectorstore + embeddings extras
        run: pip install -e ".[vectorstore,embeddings]"
      - name: Run real-backend tests
        run: python -m unittest tests.test_real_backends -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build retrieval service image
        run: docker build -f infra/docker/Dockerfile.retrieval -t ragent-retrieval:ci .
      - name: Build agent service image
        run: docker build -f infra/docker/Dockerfile.agent -t ragent-agent:ci .

  compose-smoke-test:
    # Brings the full two-service system up with docker compose (the same
    # config a developer runs locally) and exercises it end-to-end over
    # real HTTP: ingest a sample paper into the retrieval service, ask the
    # agent service a question about it, and assert the answer actually
    # cites the ingested document. This is the one CI job that proves the
    # two containers can find and talk to each other, not just that each
    # one individually imports without error.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start services
        run: docker compose up -d --build
      - name: Wait for both services to report healthy
        run: |
          for i in $(seq 1 30); do
            retrieval_ok=$(curl -sf http://localhost:8001/health && echo yes || echo no)
            agent_ok=$(curl -sf http://localhost:8000/health && echo yes || echo no)
            if [ "$retrieval_ok" = "yes" ] && [ "$agent_ok" = "yes" ]; then
              echo "both services healthy"
              exit 0
            fi
            sleep 2
          done
          echo "services did not become healthy in time"
          docker compose logs
          exit 1
      - name: Ingest a sample paper
        run: |
          curl -sf -X POST http://localhost:8001/ingest \
            -H "Content-Type: application/json" \
            -d @- <<'EOF'
          {"doc_id": "smoke_test_paper", "text": "Kubernetes schedules containers across a cluster of machines and restarts them automatically if they fail health checks."}
          EOF
      - name: Ask the agent a question and check the answer cites the ingested doc
        run: |
          response=$(curl -sf -X POST http://localhost:8000/ask \
            -H "Content-Type: application/json" \
            -d '{"question": "Question: what does Kubernetes do when a container fails a health check?"}')
          echo "$response"
          echo "$response" | grep -q "smoke_test_paper"
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate manifest structure
        run: |
          python - <<'EOF'
          import sys
          import yaml
          import glob

          required = {"apiVersion", "kind", "metadata"}
          ok = True
          for path in sorted(glob.glob("infra/k8s/*.yaml")):
              with open(path) as f:
                  docs = [d for d in yaml.safe_load_all(f) if d]
              if not docs:
                  print(f"{path}: no documents found")
                  ok = False
                  continue
              for doc in docs:
                  missing = required - doc.keys()
                  # Kustomization files don't have `metadata`/typical resource shape.
                  if doc.get("kind") == "Kustomization":
                      continue
                  if missing:
                      print(f"{path}: document missing required keys {missing}: {doc.get('kind')}")
                      ok = False
              print(f"{path}: OK ({[d.get('kind') for d in docs]})")
          sys.exit(0 if ok else 1)
          EOF

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
      - name: terraform fmt -check
        run: terraform fmt -check -recursive
      - name: terraform init (no backend, no AWS credentials needed)
        run: terraform init -backend=false
      - name: terraform validate
        run: terraform validate
